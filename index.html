<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สัตว์เลี้ยงขี้เล่น</title>
<style>
  :root {
    --sky-top: #dff1ff;
    --sky-bottom: #fdf6ff;
    --floor-top: #ffe9c7;
    --floor-bottom: #f7d7a8;
    --floor-line: rgba(180, 120, 60, .12);
    --ink: #24496f;
    --ink-soft: #5a7a9c;
    --chip-bg: rgba(255, 255, 255, .78);
    --chip-border: rgba(36, 73, 111, .12);
    --bubble-bg: #ffffff;
    --bubble-ink: #24496f;
    --cloud: rgba(255, 255, 255, .9);
    --shadow: rgba(36, 73, 111, .18);

    --cat-body: #8fd0f7;
    --cat-patch: #2f70b9;
    --cat-belly: #eaf7ff;
    --cat-line: #1d3d61;
    --cat-pink: #ff9cbc;
    --cat-mouth: #7b2846;
    --cat-blush: #ff8fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #1a2340;
      --sky-bottom: #2b2550;
      --floor-top: #3b3358;
      --floor-bottom: #2d2746;
      --floor-line: rgba(255, 255, 255, .05);
      --ink: #e4efff;
      --ink-soft: #a9bddb;
      --chip-bg: rgba(30, 36, 66, .78);
      --chip-border: rgba(255, 255, 255, .12);
      --cloud: rgba(255, 255, 255, .12);
      --shadow: rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #1a2340;
    --sky-bottom: #2b2550;
    --floor-top: #3b3358;
    --floor-bottom: #2d2746;
    --floor-line: rgba(255, 255, 255, .05);
    --ink: #e4efff;
    --ink-soft: #a9bddb;
    --chip-bg: rgba(30, 36, 66, .78);
    --chip-border: rgba(255, 255, 255, .12);
    --cloud: rgba(255, 255, 255, .12);
    --shadow: rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--sky-bottom);
    color: var(--ink);
    font-family: "Mitr", "Prompt", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    position: fixed; inset: 0;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 58%);
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  #floor {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: var(--floor-top-px, 58%);
    background:
      repeating-linear-gradient(90deg, transparent 0 78px, var(--floor-line) 78px 80px),
      linear-gradient(var(--floor-top), var(--floor-bottom));
    border-top: 3px solid var(--floor-line);
  }
  .cloud {
    position: absolute; background: var(--cloud); border-radius: 999px;
    filter: blur(.3px);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 55%; height: 160%; left: 14%; bottom: 20%; }
  .cloud::after { width: 40%; height: 130%; right: 12%; bottom: 25%; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  #hud {
    position: absolute; top: 16px; left: 16px; right: 16px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    pointer-events: none; z-index: 5;
  }
  .chip {
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 15px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #mood { font-weight: 600; transition: transform .2s; }
  #mood.pop { transform: scale(1.12); }
  #hint { color: var(--ink-soft); font-size: 13px; }

  .hud-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #belly { display: flex; align-items: center; gap: 8px; padding: 7px 12px; }
  .meter { width: 72px; height: 10px; border-radius: 99px; background: rgba(127, 140, 160, .25); overflow: hidden; }
  #bellyFill { height: 100%; width: 60%; border-radius: 99px; background: linear-gradient(90deg, #ff9a4d, #ffcf4d); transition: width .4s, background .4s; }
  #belly.hungry #bellyFill { background: linear-gradient(90deg, #ff5c6c, #ff9a4d); }
  #belly.hungry { animation: hungryPulse 1.2s ease-in-out infinite; }
  @keyframes hungryPulse { 50% { transform: scale(1.06); } }
  #foods {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 5; cursor: default; white-space: nowrap;
  }
  .foods-label { font-size: 13px; color: var(--ink-soft); padding: 0 4px 0 6px; }
  .food-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: rgba(255, 255, 255, .5); font-size: 22px; line-height: 1; cursor: pointer;
    transition: transform .15s;
  }
  .food-btn:hover { transform: translateY(-2px) scale(1.08); }
  .food-btn:active { transform: scale(.9); }
  .bowl {
    position: absolute; left: 0; top: 0; width: 76px; height: 56px; pointer-events: none; z-index: 3;
    transform-origin: 50% 100%;
    animation: bowlDrop .5s cubic-bezier(.3, 1.4, .5, 1);
  }
  .bowl .food { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 34px; transition: transform .25s, opacity .25s; }
  .bowl svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 34px; overflow: visible; }
  .bowl.gone { animation: bowlGone .5s ease-in forwards; }
  @keyframes bowlDrop { from { transform: var(--pos) translateY(-120px) scale(.6); opacity: 0; } to { transform: var(--pos); opacity: 1; } }
  @keyframes bowlGone { to { transform: var(--pos) scale(.4); opacity: 0; } }
  .cat.eat .head { animation: munch .34s ease-in-out infinite alternate; }
  .cat.eat .tail { animation-duration: .45s; }
  .cat.eat .jumper { transform: translateY(2%) scale(1.03, .97); }
  @keyframes munch { from { transform: rotate(6deg) translateY(8px); } to { transform: rotate(2deg) translateY(16px); } }
  .cat.full .rig { animation: fullBelly 1s ease-in-out infinite alternate; }
  .cat.full .arm-l { transform: rotate(-38deg); }
  .cat.full .arm-r { transform: rotate(38deg); }
  .cat.full .head { transform: rotate(-6deg); }
  @keyframes fullBelly { from { transform: scale(1); } to { transform: scale(1.05, 1.02); } }
  .cat.nope .head { animation: nope .3s ease-in-out 4; }
  @keyframes nope { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

  #picker {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    max-width: calc(100% - 32px);
    display: flex; gap: 6px; padding: 6px;
    overflow-x: auto; scrollbar-width: none;
    background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 22px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 5; cursor: default;
  }
  #picker::-webkit-scrollbar { display: none; }
  .pet-btn {
    flex: 0 0 auto; width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 2px 6px; border: 2px solid transparent; border-radius: 16px;
    background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .pet-btn:hover { transform: translateY(-2px); background: rgba(127, 170, 220, .14); }
  .pet-btn[aria-pressed="true"] { border-color: #6aa8f0; background: rgba(106, 168, 240, .18); font-weight: 600; }
  .pet-btn .thumb { width: 44px; height: 44px; }
  .pet-btn .thumb svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pet-btn .thumb .tail, .pet-btn .thumb .eyes-open, .pet-btn .thumb .e-star, .pet-btn .thumb .e-heart { animation: none; }
  .cat.poof .jumper { animation: poof .5s ease-in-out; }
  @keyframes poof { 0% { transform: scale(1); } 45% { transform: scale(.05) rotate(20deg); opacity: .2; } 55% { transform: scale(.05) rotate(-20deg); opacity: .2; } 100% { transform: scale(1); } }

  /* ---------- cat ---------- */
  .cat {
    position: absolute; left: 0; top: 0;
    width: var(--size); height: var(--size);
    transform-origin: 50% 100%;
    will-change: transform;
    z-index: 2;
    outline: none;
  }
  .shadow {
    position: absolute; left: 22%; right: 22%; bottom: 1%; height: 8%;
    background: var(--shadow); border-radius: 50%;
    transition: transform .3s;
  }
  .jumper {
    position: absolute; inset: 0;
    transform-origin: 50% 96%;
    transition: transform .35s ease;
  }
  .flip {
    position: absolute; inset: 0;
    transform: scaleX(var(--face, 1));
    transition: transform .22s ease;
  }
  .cat svg { width: 100%; height: 100%; overflow: visible; display: block; }

  .bubble {
    position: absolute; left: 50%; bottom: 100%;
    transform: translate(-50%, 6px) scale(.6);
    opacity: 0;
    background: var(--bubble-bg); color: var(--bubble-ink);
    padding: 8px 14px; border-radius: 18px;
    font-size: 18px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(36, 73, 111, .18);
    transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1);
    pointer-events: none;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    margin-left: -8px; border: 8px solid transparent; border-top-color: var(--bubble-bg);
  }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* svg parts: transform origins in viewBox units */
  .rig, .tail, .head, .ear-l, .ear-r, .arm-l, .arm-r, .foot-l, .foot-r, .eyes-open, .nose-bubble, .body-g {
    transition: transform .3s ease;
  }
  .rig { transform-origin: 100px 196px; }
  .body-g { transform-origin: 100px 190px; }
  .tail { transform-origin: 136px 172px; animation: tailWag 1.4s ease-in-out infinite; }
  .head { transform-origin: 100px 128px; }
  .ear-l { transform-origin: 66px 52px; }
  .ear-r { transform-origin: 134px 52px; }
  .arm-l { transform-origin: 74px 136px; }
  .arm-r { transform-origin: 126px 136px; }
  .foot-l { transform-origin: 78px 190px; }
  .foot-r { transform-origin: 122px 190px; }
  .eyes-open { transform-origin: 100px 86px; animation: blink 4.4s infinite; }
  .nose-bubble { transform-origin: 104px 101px; transform: scale(0); }

  .eyes > g, .mouths > g { display: none; }
  [data-eyes="open"]   .e-open,
  [data-eyes="happy"]  .e-happy,
  [data-eyes="half"]   .e-half,
  [data-eyes="flat"]   .e-flat,
  [data-eyes="closed"] .e-closed,
  [data-eyes="star"]   .e-star,
  [data-eyes="heart"]  .e-heart,
  [data-eyes="dizzy"]  .e-dizzy,
  [data-eyes="wide"]   .e-open { display: inline; }
  [data-eyes="wide"] .eyes-open { animation: none; transform: scale(1.18); }

  [data-mouth="smile"] .m-smile,
  [data-mouth="grin"]  .m-grin,
  [data-mouth="w"]     .m-w,
  [data-mouth="o"]     .m-o,
  [data-mouth="yawn"]  .m-yawn,
  [data-mouth="flat"]  .m-flat { display: inline; }

  .blush { transition: opacity .3s; opacity: .55; }
  .cat:hover .blush, .cat.blushy .blush { opacity: .95; }
  .e-star use { fill: #ffd34d; stroke: var(--cat-line); stroke-width: 1.6; stroke-linejoin: round; }
  .e-star { animation: twinkle .5s ease-in-out infinite alternate; transform-origin: 100px 86px; }
  .e-heart use { fill: #ff4f8b; stroke: var(--cat-line); stroke-width: 1.4; }
  .e-heart { animation: heartBeat .6s ease-in-out infinite; transform-origin: 100px 86px; }

  @keyframes tailWag { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(14deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes twinkle { from { transform: scale(.92) rotate(-6deg); } to { transform: scale(1.12) rotate(6deg); } }
  @keyframes heartBeat { 0%,100% { transform: scale(1); } 30% { transform: scale(1.18); } 60% { transform: scale(.96); } }

  /* ----- walking ----- */
  .cat.walk .foot-l { animation: step var(--step, .42s) ease-in-out infinite; }
  .cat.walk .foot-r { animation: step var(--step, .42s) ease-in-out infinite calc(var(--step, .42s) / -2); }
  .cat.walk .arm-l  { animation: swingL var(--step, .42s) ease-in-out infinite; }
  .cat.walk .arm-r  { animation: swingR var(--step, .42s) ease-in-out infinite; }
  .cat.walk .rig    { animation: bob calc(var(--step, .42s) / 2) ease-in-out infinite alternate; }
  .cat.walk .head   { animation: headSway calc(var(--step, .42s) * 2) ease-in-out infinite; }
  .cat.walk .tail   { animation-duration: .7s; }
  .cat.run { --step: .2s; }
  .cat.slow { --step: .8s; }
  @keyframes step { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px) rotate(-6deg); } }
  @keyframes swingL { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(-10deg); } }
  @keyframes swingR { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(-10deg); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @keyframes headSway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* ----- idle mini behaviours ----- */
  .cat.look .head { animation: lookAround 1.8s ease-in-out; }
  @keyframes lookAround { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg) translateX(-4px); } 70% { transform: rotate(10deg) translateX(4px); } }

  .cat.groom .arm-r { animation: lick .32s ease-in-out infinite alternate; }
  .cat.groom .head  { transform: rotate(6deg); }
  @keyframes lick { from { transform: rotate(128deg); } to { transform: rotate(140deg) translateY(-3px); } }

  .cat.twitch .ear-l { animation: earTwitchL .5s ease-in-out 2; }
  .cat.twitch .ear-r { animation: earTwitchR .5s ease-in-out 1 .2s; }
  @keyframes earTwitchL { 50% { transform: rotate(-16deg); } }
  @keyframes earTwitchR { 50% { transform: rotate(16deg); } }

  .cat.tailflick .tail { animation: tailFlick .5s ease-in-out 3; }
  @keyframes tailFlick { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(28deg); } }

  /* ----- bored ----- */
  .cat.bored .jumper { transform: translateY(3%) scale(1.02, .96); }
  .cat.bored .head { transform: rotate(-9deg) translateY(4px); }
  .cat.bored .tail { animation-duration: 3.4s; }
  .cat.bored .ear-l { transform: rotate(-10deg); }
  .cat.bored .ear-r { transform: rotate(10deg); }
  .cat.sigh .rig { animation: sigh 1.6s ease-in-out; }
  @keyframes sigh { 0%,100% { transform: scale(1); } 35% { transform: scale(1.04, 1.06); } 70% { transform: scale(1.03, .94); } }

  /* ----- sleepy ----- */
  .cat.sleepy .jumper { transform: translateY(4%) scale(1.03, .95); }
  .cat.sleepy .head { animation: nod 3.2s ease-in-out infinite; }
  .cat.sleepy .ear-l { transform: rotate(-14deg); }
  .cat.sleepy .ear-r { transform: rotate(14deg); }
  .cat.sleepy .tail { animation-duration: 4s; }
  @keyframes nod {
    0%, 50% { transform: rotate(0) translateY(0); }
    78% { transform: rotate(9deg) translateY(9px); }
    82% { transform: rotate(-3deg) translateY(-2px); }
    100% { transform: rotate(0) translateY(0); }
  }
  .cat.yawn .head { animation: yawnHead 1.8s ease-in-out; }
  .cat.yawn .arm-l { animation: stretchL 1.8s ease-in-out; }
  .cat.yawn .arm-r { animation: stretchR 1.8s ease-in-out; }
  .cat.yawn .rig { animation: stretchBody 1.8s ease-in-out; }
  @keyframes yawnHead { 0%,100% { transform: none; } 30%,75% { transform: rotate(-4deg) translateY(-6px); } }
  @keyframes stretchL { 0%,100% { transform: rotate(0); } 30%,75% { transform: rotate(165deg); } }
  @keyframes stretchR { 0%,100% { transform: rotate(0); } 30%,75% { transform: rotate(-165deg); } }
  @keyframes stretchBody { 0%,100% { transform: none; } 30%,75% { transform: scale(.97, 1.07); } }

  /* ----- asleep ----- */
  .cat.sleep .jumper { transform: translateY(9%) scale(1.1, .84); }
  .cat.sleep .rig { animation: breathe 2.8s ease-in-out infinite; }
  .cat.sleep .head { transform: rotate(10deg) translateY(16px); }
  .cat.sleep .arm-l { transform: rotate(-62deg) translateY(4px); }
  .cat.sleep .arm-r { transform: rotate(62deg) translateY(4px); }
  .cat.sleep .ear-l { transform: rotate(-22deg); }
  .cat.sleep .ear-r { transform: rotate(18deg); }
  .cat.sleep .tail { animation: none; transform: rotate(58deg); }
  .cat.sleep .nose-bubble { animation: snot 2.8s ease-in-out infinite; }
  .cat.sleep .shadow { transform: scaleX(1.25); }
  @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.025, 1.045); } }
  @keyframes snot { 0%,100% { transform: scale(.25); } 50% { transform: scale(1.15); } }
  .cat.sleep.stir .ear-l { animation: earTwitchL .4s ease-in-out 2; }
  .cat.sleep.stir .head { transform: rotate(4deg) translateY(12px); }

  /* ----- groggy wake ----- */
  .cat.groggy .jumper { animation: wobble 1.2s ease-in-out infinite; }
  .cat.groggy.rub .arm-r { animation: rub .45s ease-in-out infinite alternate; }
  .cat.groggy.rub .head { transform: rotate(5deg) translateY(4px); }
  .cat.groggy.stretch .arm-l { transform: rotate(165deg); }
  .cat.groggy.stretch .arm-r { transform: rotate(-165deg); }
  .cat.groggy.stretch .rig { transform: scale(.96, 1.08); }
  .cat.groggy.stretch .head { transform: rotate(-5deg) translateY(-6px); }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes rub { from { transform: translateY(-12px) rotate(168deg); } to { transform: translateY(-14px) rotate(182deg); } }

  /* ----- click actions ----- */
  .cat.a-wave .arm-r { animation: wave .42s ease-in-out infinite alternate; }
  .cat.a-wave .head { transform: rotate(-7deg); }
  .cat.a-wave .tail { animation-duration: .5s; }
  @keyframes wave { from { transform: translateX(6px) rotate(-100deg); } to { transform: translateX(6px) rotate(-145deg); } }

  .cat.a-jump .jumper { animation: jump 1s cubic-bezier(.3, .7, .4, 1); }
  .cat.a-jump .shadow { animation: shadowJump 1s cubic-bezier(.3, .7, .4, 1); }
  .cat.a-jump .arm-l { animation: armsUpL 1s ease-in-out; }
  .cat.a-jump .arm-r { animation: armsUpR 1s ease-in-out; }
  .cat.a-jump .foot-l, .cat.a-jump .foot-r { animation: tuck 1s ease-in-out; }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    16% { transform: translateY(0) scale(1.16, .8); }
    38% { transform: translateY(-62%) scale(.9, 1.12); }
    56% { transform: translateY(-70%) scale(1, 1); }
    80% { transform: translateY(0) scale(1.16, .84); }
    90% { transform: translateY(-5%) scale(.97, 1.04); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes shadowJump { 0%,100% { transform: scale(1); opacity: 1; } 56% { transform: scale(.5); opacity: .5; } }
  @keyframes armsUpL { 0%,100% { transform: rotate(0); } 35%,65% { transform: rotate(150deg); } }
  @keyframes armsUpR { 0%,100% { transform: rotate(0); } 35%,65% { transform: rotate(-150deg); } }
  @keyframes tuck { 0%,100% { transform: none; } 40%,60% { transform: translateY(-6px); } }

  .cat.a-excited .jumper { animation: hop .3s ease-out infinite alternate; }
  .cat.a-excited .arm-l { animation: cheerL .3s ease-in-out infinite alternate; }
  .cat.a-excited .arm-r { animation: cheerR .3s ease-in-out infinite alternate; }
  .cat.a-excited .tail { animation-duration: .3s; }
  .cat.a-excited .ear-l { transform: rotate(8deg); }
  .cat.a-excited .ear-r { transform: rotate(-8deg); }
  @keyframes hop { from { transform: translateY(0) scale(1.06, .94); } to { transform: translateY(-16%) scale(.96, 1.05); } }
  @keyframes cheerL { from { transform: rotate(135deg); } to { transform: rotate(165deg); } }
  @keyframes cheerR { from { transform: rotate(-135deg); } to { transform: rotate(-165deg); } }

  .cat.a-spin .jumper { animation: spin 1s ease-in-out; }
  .cat.a-spin .arm-l { transform: rotate(110deg); }
  .cat.a-spin .arm-r { transform: rotate(-110deg); }
  @keyframes spin {
    0% { transform: translateY(0) scaleX(1); }
    12% { transform: translateY(-14%) scaleX(-1); }
    25% { transform: translateY(-20%) scaleX(1); }
    37% { transform: translateY(-20%) scaleX(-1); }
    50% { transform: translateY(-20%) scaleX(1); }
    62% { transform: translateY(-20%) scaleX(-1); }
    75% { transform: translateY(-14%) scaleX(1); }
    88% { transform: translateY(0) scale(1.1, .9); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .cat.dizzy .head { animation: dizzyHead .5s ease-in-out infinite alternate; }
  .cat.dizzy .jumper { animation: wobble .6s ease-in-out infinite; }
  @keyframes dizzyHead { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }

  .cat.a-love .jumper { animation: lovePulse .8s ease-in-out infinite; }
  .cat.a-love .arm-l { transform: rotate(-28deg); }
  .cat.a-love .arm-r { transform: rotate(28deg); }
  .cat.a-love .head { animation: headSway 1.6s ease-in-out infinite; }

  // scalloped "fluffy" outline around an ellipse
  function fluff(cx, cy, rx, ry, n, amp) {
    const pt = (a, k) => [(cx + Math.cos(a) * rx * k).toFixed(1), (cy + Math.sin(a) * ry * k).toFixed(1)];

    <g class="foot-r"><ellipse cx="122" cy="187" rx="15" ry="9" fill="${p.footR}" stroke="var(--cat-line)" stroke-width="3"/></g>
    <g class="body-g">
      <path d="${p.body}" fill="${B}"/>
      <g clip-path="url(#${id}b)">${p.bodyMarks}</g>
      <path d="${p.body}" fill="none" stroke="var(--cat-line)" stroke-width="3"/>
    </g>
    <g class="head">
      ${p.behindHead || ''}
      ${p.earsFront ? '' : ears}
      <path d="${p.head}" fill="${B}"/>
      <g clip-path="url(#${id}h)">${p.headMarks}</g>
      <path d="${p.head}" fill="none" stroke="var(--cat-line)" stroke-width="3"/>
      ${p.earsFront ? ears : ''}
      ${p.overHead || ''}
      <ellipse class="blush" cx="60" cy="104" rx="10" ry="6" fill="var(--cat-blush)"/>
      <ellipse class="blush" cx="140" cy="104" rx="10" ry="6" fill="var(--cat-blush)"/>
      <g class="eyes">
        <g class="e-open"><g class="eyes-open"><g class="pupils">${eyeOpen(78)}${eyeOpen(122)}</g></g></g>
        <g class="e-happy" fill="none" stroke="var(--cat-line)" stroke-width="4"><path d="M69 90 Q78 77 87 90"/><path d="M113 90 Q122 77 131 90"/></g>
        <g class="e-half"><path d="M70 85 Q78 98 86 85 Z" fill="var(--cat-line)"/><path d="M114 85 Q122 98 130 85 Z" fill="var(--cat-line)"/><path d="M67 85 L89 85 M111 85 L133 85" stroke="var(--cat-line)" stroke-width="3.5"/></g>
        <g class="e-flat"><path d="M70 87 Q78 96 86 87 Z" fill="var(--cat-line)"/><path d="M114 87 Q122 96 130 87 Z" fill="var(--cat-line)"/><path d="M68 86 L88 84 M112 84 L132 86" stroke="var(--cat-line)" stroke-width="3.5"/></g>
        <g class="e-closed" fill="none" stroke="var(--cat-line)" stroke-width="3.5"><path d="M70 86 Q78 94 86 86"/><path d="M114 86 Q122 94 130 86"/></g>
        <g class="e-star"><use href="#${id}star" x="78" y="86"/><use href="#${id}star" x="122" y="86"/></g>
        <g class="e-heart"><use href="#${id}heart" x="78" y="87"/><use href="#${id}heart" x="122" y="87"/></g>
        <g class="e-dizzy" fill="none" stroke="var(--cat-line)" stroke-width="2.6">
          <path d="M78 86 m-1 0 a1.5 1.5 0 1 1 3 0 a4 4 0 1 1 -8 0 a6.5 6.5 0 1 1 13 0 a8 8 0 1 1 -16 0"/>
          <path d="M122 86 m-1 0 a1.5 1.5 0 1 1 3 0 a4 4 0 1 1 -8 0 a6.5 6.5 0 1 1 13 0 a8 8 0 1 1 -16 0"/>
        </g>
      </g>
      ${p.face || ''}
      ${nose}
      <circle class="nose-bubble" cx="109" cy="100" r="7" fill="rgba(190,230,255,.65)" stroke="rgba(120,180,230,.9)" stroke-width="1.2"/>
      <g class="mouths" stroke="var(--cat-line)" stroke-width="2.6" fill="none">
        <g class="m-smile"><path d="M85 106 Q100 132 115 106 Z" fill="var(--cat-mouth)"/><path d="M92 118 Q100 112 108 118 Q100 125 92 118 Z" fill="var(--cat-pink)" stroke="none"/><path d="M91 103 Q95.5 108 100 103 Q104.5 108 109 103"/></g>
        <g class="m-grin"><path d="M80 105 Q100 140 120 105 Z" fill="var(--cat-mouth)"/><path d="M89 121 Q100 113 111 121 Q100 131 89 121 Z" fill="var(--cat-pink)" stroke="none"/><path d="M89 103 Q94.5 108 100 103 Q105.5 108 111 103"/></g>
        <g class="m-w"><path d="M90 104 Q95 110 100 104 Q105 110 110 104"/></g>
        <g class="m-o"><path d="M91 103 Q95.5 107 100 103 Q104.5 107 109 103"/><ellipse cx="100" cy="114" rx="6" ry="7" fill="var(--cat-mouth)"/></g>
        <g class="m-yawn"><ellipse cx="100" cy="116" rx="11" ry="14" fill="var(--cat-mouth)"/><ellipse cx="100" cy="124" rx="7" ry="4.5" fill="var(--cat-pink)" stroke="none"/></g>
        <g class="m-flat"><path d="M90 109 Q95 105 100 109 Q105 113 110 109"/></g>
      </g>
      ${p.whiskers ? `<g stroke="var(--cat-line)" stroke-width="2" opacity=".7"><path d="M46 96 L26 92 M46 102 L24 104"/><path d="M154 96 L174 92 M154 102 L176 104"/></g>` : ''}
    </g>
    <g class="arm-l"><rect x="66" y="128" width="17" height="42" rx="8.5" fill="${p.armL}" stroke="var(--cat-line)" stroke-width="3"/><path d="M71 165 L71 169 M78 165 L78 169" stroke="${p.toe}" stroke-width="2"/></g>
    <g class="arm-r"><rect x="117" y="128" width="17" height="42" rx="8.5" fill="${p.armR}" stroke="var(--cat-line)" stroke-width="3"/><path d="M122 165 L122 169 M129 165 L129 169" stroke="${p.toe}" stroke-width="2"/></g>
  </g>
</svg>`;
  }
  function paint(el, p) {
    el.style.setProperty('--cat-body', p.colors.body);
    el.style.setProperty('--cat-patch', p.colors.patch);
    el.style.setProperty('--cat-belly', p.colors.belly);
    el.style.setProperty('--cat-line', p.colors.line);
    el.style.setProperty('--cat-pink', p.colors.pink);
  }
  return { PETS, svg, paint };
})();
</script>
<script>
(() => {
  const stage = document.getElementById('stage');
  const floor = document.getElementById('floor');
  const catEl = document.getElementById('cat');
  const bubble = document.getElementById('bubble');
  const moodEl = document.getElementById('mood');
  const flipEl = catEl.querySelector('.flip');
  const pickerEl = document.getElementById('picker');
  const foodsEl = document.getElementById('foods');
  const bellyEl = document.getElementById('belly');
  const bellyFill = document.getElementById('bellyFill');
  let pupils = null;
  let pet = PetArt.PETS[0];

  // idle thresholds (ms since the last time someone played with the cat)
  const T_BORED = 12000, T_SLEEPY = 22000, T_SLEEP = 32000;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  let W = 0, H = 0, size = 200, floorTop = 0, floorBottom = 0;
  function layout() {
    W = stage.clientWidth; H = stage.clientHeight;
    size = Math.round(Math.max(130, Math.min(230, W * 0.36, H * 0.32)) * pet.scale);
    floorTop = Math.round(H * 0.58);
    foodsEl.style.bottom = (pickerEl.offsetHeight + 20) + 'px';
    floorBottom = H - Math.max(18, H * 0.04) - pickerEl.offsetHeight - foodsEl.offsetHeight - 8;
    floor.style.setProperty('--floor-top-px', floorTop + 'px');
    floor.style.top = floorTop + 'px';
    catEl.style.setProperty('--size', size + 'px');
    cat.x = Math.min(Math.max(cat.x, size / 2), W - size / 2);
    cat.y = Math.min(Math.max(cat.y, floorTop + 20), floorBottom);
  }

  const cat = {
    x: 0, y: 0, face: 1,
    target: null, speed: 90, onArrive: null,
    mode: 'awake',            // awake | action | bored | sleepy | sleep | groggy
    lastPoke: performance.now(),
    nextIdle: performance.now() + 1500,
  };

  // ---------- timers that belong to the current activity ----------
  let timers = [];
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  // ---------- presentation helpers ----------
  const MODE_CLASSES = ['walk', 'run', 'slow', 'bored', 'sleepy', 'sleep', 'groggy', 'rub', 'stretch', 'dizzy', 'blushy', 'dragged', 'falling', 'land', 'poof', 'eat', 'full', 'nope'];
  const MINI_CLASSES = ['look', 'groom', 'twitch', 'tailflick', 'sigh', 'yawn', 'stir'];
  const ACTION_CLASSES = ['a-wave', 'a-jump', 'a-excited', 'a-spin', 'a-love', 'a-dance', 'a-flip', 'a-peek', 'a-boo', 'a-giggle', 'a-pounce', 'a-zoom'];

  function face(eyes, mouth) {
    if (eyes) catEl.dataset.eyes = eyes;
    if (mouth) catEl.dataset.mouth = mouth;
  }
  function setClasses(add = []) {
    catEl.classList.remove(...MODE_CLASSES.filter(c => c !== 'walk' && c !== 'run' && c !== 'slow'), ...MINI_CLASSES, ...ACTION_CLASSES);
    add.forEach(c => catEl.classList.add(c));
  }
  function restart(cls) {
    catEl.classList.remove(cls);
    void catEl.offsetWidth; // let the animation start again
    catEl.classList.add(cls);
  }

  let sayTimer = null;
  function say(text, ms = 1800) {
    bubble.textContent = text.replaceAll('เหมียว', pet.sound).replaceAll('ปลาทู', pet.dream);
    bubble.classList.add('show');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }
  function hush() { clearTimeout(sayTimer); bubble.classList.remove('show'); }

  let moodText = '';
  function mood(text) {
    if (text === moodText) return;
    moodText = text;
    moodEl.textContent = text;
    moodEl.classList.remove('pop'); void moodEl.offsetWidth; moodEl.classList.add('pop');
    setTimeout(() => moodEl.classList.remove('pop'), 220);
  }

  // ---------- particles ----------
  function scale() { return 0.78 + 0.34 * Math.max(0, cat.y - floorTop) / Math.max(1, floorBottom - floorTop); }
  function headPos() { const s = scale(); return { x: cat.x, y: cat.y - size * s * 0.62, s }; }

  function fx(text, opts = {}) {
    const el = document.createElement('div');
    el.className = 'fx' + (opts.cls ? ' ' + opts.cls : '');
    if (text) el.textContent = text;
    const p = opts.at || headPos();
    el.style.left = (p.x + (opts.ox || 0)) + 'px';
    el.style.top = (p.y + (opts.oy || 0)) + 'px';
    el.style.setProperty('--dx', (opts.dx ?? rand(-60, 60)) + 'px');
    el.style.setProperty('--dy', (opts.dy ?? rand(-120, -70)) + 'px');
    el.style.setProperty('--rot', (opts.rot ?? rand(-30, 30)) + 'deg');
    el.style.setProperty('--dur', (opts.dur || 1.6) + 's');
    el.style.fontSize = (opts.size || 26) * (p.s || 1) + 'px';
    if (opts.color) el.style.color = opts.color;
    if (opts.bg) el.style.background = opts.bg;
    if (opts.w) { el.style.width = opts.w + 'px'; el.style.height = (opts.h || opts.w) + 'px'; }
    if (opts.delay) el.style.animationDelay = opts.delay + 's';
    el.addEventListener('animationend', () => el.remove());
    stage.appendChild(el);
  }
  const burst = (chars, n, colors, o = {}) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-.3, .3);
      const r = rand(70, 130);
      fx(pick(chars), { dx: Math.cos(a) * r, dy: Math.sin(a) * r - 30, color: pick(colors), size: rand(18, 30), delay: rand(0, .25), ...o });
    }
  };
  const floaty = (chars, n, colors, o = {}) => {
    for (let i = 0; i < n; i++) fx(pick(chars), { color: pick(colors), size: rand(20, 32), delay: i * 0.15, ox: rand(-40, 40), dur: 2, ...o });
  };
  function dust(n = 3) {
    for (let i = 0; i < n; i++) {
      fx('', { cls: 'dust', at: { x: cat.x - cat.face * size * 0.25, y: cat.y - 8, s: 1 }, dx: -cat.face * rand(20, 60), dy: rand(-30, -10), dur: .7, delay: i * .06 });
    }
  }
  function confetti(n = 26) {
    const colors = ['#ff6fa5', '#ffd34d', '#5cc8ff', '#8be38b', '#b28cff', '#ff9a4d'];
    const p = headPos();
    for (let i = 0; i < n; i++) {
      fx('', { cls: 'fall', at: { x: p.x, y: p.y - 30, s: 1 }, bg: pick(colors), w: rand(6, 11), h: rand(10, 16), dx: rand(-200, 200), dy: rand(120, 260), rot: rand(-540, 540), dur: rand(1.6, 2.4), delay: rand(0, .2) });
    }
  }
  const HEARTS = ['♥', '♡', '💗'];
  const PINKS = ['#ff4f8b', '#ff8fb0', '#ff6fa5'];
  const STARS = ['★', '✦', '✧', '✨'];
  const GOLDS = ['#ffc93c', '#ffd966', '#ffb703', '#7fd1ff'];
  const NOTES = ['♪', '♫', '♬'];
  const BLUES = ['#3d7fd1', '#6aa8f0', '#b28cff'];

  // ---------- movement ----------
  function walkTo(x, y, speed = 90, onArrive = null) {
    const half = size * 0.4;
    cat.target = { x: Math.min(Math.max(x, half), W - half), y: Math.min(Math.max(y, floorTop + 20), floorBottom) };
    cat.speed = speed;
    cat.onArrive = onArrive;
  }
  function stopWalking() {
    cat.target = null; cat.onArrive = null;
    catEl.classList.remove('walk', 'run', 'slow');
  }
  function randomSpot() { return { x: rand(size * 0.5, W - size * 0.5), y: rand(floorTop + 30, floorBottom) }; }

  // ---------- moods ----------
  function setMode(m) {
    cat.mode = m;
    clearTimers();
    stopWalking();
    setClasses(m === 'awake' || m === 'action' ? [] : [m]);
    const now = performance.now();
    if (m === 'awake') { face('open', 'smile'); mood(hungry() ? '🥺 หิวจัง' : '😸 ร่าเริง'); cat.nextIdle = now + rand(800, 2000); }
    if (m === 'bored') { face('flat', 'flat'); mood('😑 เบื่อจัง…'); say(pick(['เฮ้อ… ไม่มีใครเล่นด้วยเลย', 'เบื่อจัง~', 'เฮ้อออ…']), 2200); cat.nextIdle = now + rand(2500, 4000); }
    if (m === 'sleepy') { face('half', 'w'); mood('🥱 ง่วงนอน…'); yawn(); cat.nextIdle = now + rand(3500, 5000); }
    if (m === 'sleep') { face('closed', 'w'); mood('😴 หลับปุ๋ย'); hush(); cat.nextIdle = now + 900; }
  }

  // idle behaviours that happen on their own (they don't count as play)
  function idleTick(now) {
    if (now < cat.nextIdle) return;
    if (cat.mode === 'awake') {
      cat.nextIdle = now + rand(1800, 4200);
      if (cat.target) return;
      if (hungry() && Math.random() < 0.35) {
        mini('nope', 1200, 'half', 'o');
        say(pick(['หิวจัง… 🥺', 'ท้องร้องจ๊อกๆ…', 'ขอข้าวหน่อยน้า~', 'มีอะไรกินบ้าง?']), 1800);
        return;
      }
      const r = Math.random();
      if (r < 0.55) { const p = randomSpot(); walkTo(p.x, p.y, rand(70, 110)); }
      else if (r < 0.68) mini('look', 1800, 'open', 'smile');
      else if (r < 0.8) { mini('groom', 2000, 'closed', 'w'); }
      else if (r < 0.9) mini('tailflick', 1500, 'happy', 'smile');
      else { mini('twitch', 1000); if (Math.random() < .5) say(pick(['เหมียว~', 'ลั้นลา~', 'มาเล่นกันไหม?', 'เมี้ยว ♪']), 1500); }
    } else if (cat.mode === 'bored') {
      cat.nextIdle = now + rand(3500, 5500);
      if (cat.target) return;
      const r = Math.random();
      if (r < 0.45) { restart('sigh'); say(pick(['เฮ้อ…', 'เบื่ออ…', 'ว่างจัง…']), 1500); fx('~', { color: '#9fb4c8', size: 30, oy: size * .25, dx: rand(20, 50), dy: -40 }); }
      else if (r < 0.75) { const p = randomSpot(); catEl.classList.add('slow'); walkTo(cat.x + rand(-140, 140), p.y, 35, () => catEl.classList.remove('slow')); }
      else restart('twitch');
    } else if (cat.mode === 'sleepy') {
      cat.nextIdle = now + rand(3800, 5500);
      if (Math.random() < 0.6) yawn(); else say(pick(['ง่วงจัง…', 'หนังตาหนัก…', 'ขอนอนแป๊บ…']), 1700);
    } else if (cat.mode === 'sleep') {
      cat.nextIdle = now + 1300;
      const p = headPos();
      fx(pick(['z', 'Z', 'z']), { cls: 'zzz', at: { x: p.x + size * p.s * 0.22, y: p.y - 10, s: p.s }, dx: rand(30, 70), dy: rand(-90, -60), size: rand(20, 32), dur: 2.6, rot: rand(-20, 20) });
      if (Math.random() < 0.1) say(pick(['งืม… ปลาทู…', 'คร่อก… ฟี้…', 'งึมงำ…', 'อีก 5 นาที…']), 1800);
      if (Math.random() < 0.08) restart('twitch');
    }
  }

  function mini(cls, ms, eyes, mouth) {
    const prev = [catEl.dataset.eyes, catEl.dataset.mouth];
    restart(cls);
    if (eyes) face(eyes, mouth);
    later(() => {
      catEl.classList.remove(cls);
      if (eyes && cat.mode === 'awake') face(prev[0], prev[1]);
    }, ms);
  }

  function yawn() {
    const eyes = catEl.dataset.eyes;
    restart('yawn');
    face('closed', 'yawn');
    say(pick(['หาววว~', 'ฮ้าววว…']), 1500);
    later(() => { catEl.classList.remove('yawn'); if (cat.mode === 'sleepy') face('half', 'w'); else face(eyes, 'w'); }, 1800);
  }

  // ---------- reactions to play ----------
  const ACTIONS = {
    wave: () => {
      setClasses(['a-wave']); face('happy', 'smile');
      say(pick(['สวัสดี~ เหมียว!', 'หวัดดีจ้า~ 👋', 'ฮัลโหล~!']));
      floaty(['✦', '♪'], 3, GOLDS);
      return 2200;
    },
    jump: () => {
      setClasses(['a-jump']); face('happy', 'grin');
      say(pick(['ฮึบ!', 'โดดดด~!', 'ย้าฮู้!']), 1200);
      later(() => burst(STARS, 10, GOLDS), 420);
      later(() => dust(4), 820);
      return 1100;
    },
    excited: () => {
      setClasses(['a-excited']); face('star', 'grin');
      say(pick(['ว้าววว!!', 'ตื่นเต้นจังเลย!!', 'เย้ๆๆ!!']));
      burst(STARS, 12, GOLDS);
      later(() => burst(STARS, 8, GOLDS), 900);
      return 2000;
    },
    spin: () => {
      setClasses(['a-spin']); face('happy', 'grin');
      say('หมุนติ้ว~', 1000);
      later(() => { setClasses(['dizzy']); face('dizzy', 'o'); say('@_@ มึนนน…', 1300); floaty(['✧', '★'], 3, GOLDS, { dur: 1.2 }); }, 1000);
      return 2400;
    },
    love: () => {
      setClasses(['a-love']); face('heart', 'smile');
      say(pick(['รักนะ ♥', 'ชอบที่สุดเลย~', 'อุ่นใจจัง ♥']));
      floaty(HEARTS, 6, PINKS);
      return 2300;
    },
    dance: () => {
      setClasses(['a-dance']); face('happy', 'smile');
      say(pick(['♪ ลั้นลา ♪', 'เต้นกันเถอะ~', '♫ เหมียว เหมียว ♫']), 2200);
      floaty(NOTES, 6, BLUES, { dur: 1.8 });
      return 2600;
    },
    flip: () => {
      setClasses(['a-flip']); face('closed', 'grin');
      say('ตีลังกา! ✨', 1200);
      later(() => { face('star', 'grin'); burst(STARS, 10, GOLDS); dust(4); }, 860);
      return 1500;
    },
    peekaboo: () => {
      setClasses(['a-peek']); face('closed', 'w');
      say('ซ่อนแล้วน้า…', 1100);
      later(() => { setClasses(['a-boo']); face('wide', 'grin'); say('จ๊ะเอ๋!', 1200); burst(STARS, 8, GOLDS); }, 1200);
      return 2300;
    },
    giggle: () => {
      setClasses(['a-giggle']); face('happy', 'grin');
      say(pick(['คิกๆๆ จั๊กจี้!', 'ฮิฮิ~', 'อย่าจิ้มสิ คิกๆ']));
      floaty(['♪', '✿', '♡'], 4, PINKS.concat(GOLDS));
      return 1700;
    },
    pounce: () => {
      setClasses(['a-pounce']); face('wide', 'w');
      say('ตะครุบ!', 1300);
      const dir = cat.face;
      later(() => { walkTo(cat.x + dir * size * 0.6, cat.y, 380); face('happy', 'grin'); }, 650);
      later(() => dust(4), 1000);
      return 1300;
    },
    zoomies: () => {
      setClasses(['a-zoom']); face('star', 'grin');
      say('วิ้งงงง~!', 1400);
      const startX = cat.x;
      const farX = cat.x < W / 2 ? W - size * 0.4 : size * 0.4;
      catEl.classList.add('run');
      const dusty = setInterval(() => dust(2), 120); timers.push(dusty);
      walkTo(farX, cat.y, 520, () => {
        catEl.classList.add('run');
        walkTo(startX + (farX > startX ? 40 : -40), cat.y, 520, () => clearInterval(dusty));
      });
      return Math.max(1600, (Math.abs(farX - startX) * 2) / 520 * 1000 + 400);
    },
    smile: () => {
      setClasses(['blushy']); face('happy', 'grin');
      say(pick(['เหมียว~ 😸', 'ยิ้มแป้นเลย~', 'อิอิ']));
      floaty(['✿', '♡'], 3, PINKS);
      return 1600;
    },
  };
  const ACTION_NAMES = Object.keys(ACTIONS);
  let lastAction = '';

  function doAction(name) {
    clearTimers();
    stopWalking();
    cat.mode = 'action';
    mood(pick(['🤩 ตื่นเต้น!', '😆 สนุกจัง!', '😻 ดีใจ!']));
    const ms = ACTIONS[name]();
    lastAction = name;
    catEl.classList.toggle('walk', !!cat.target);
    later(() => { setMode('awake'); cat.lastPoke = performance.now(); }, ms);
  }

  function superExcited() {
    clearTimers(); stopWalking();
    cat.mode = 'action';
    mood('🤩 ตื่นเต้นสุดๆ!!');
    setClasses(['a-excited']); face('star', 'grin');
    say('ตื่นเต้นสุดๆ ไปเลย!!!', 2200);
    confetti(30);
    burst(STARS, 14, GOLDS);
    later(() => { setClasses(['a-flip']); face('star', 'grin'); }, 1300);
    later(() => { confetti(20); burst(HEARTS, 8, PINKS); }, 2200);
    later(() => { setMode('awake'); cat.lastPoke = performance.now(); }, 2700);
  }

  function wakeUpGroggy() {
    clearTimers(); stopWalking();
    cat.mode = 'groggy';
    setClasses(['groggy', 'rub']); face('half', 'w');
    mood('😵‍💫 งัวเงีย…');
    say(pick(['งือ… ใครปลุกเค้า…', 'อือ… อะไรเหรอ…', 'งืมม… ยังง่วงอยู่เลย…']), 1700);
    later(() => face('closed', 'w'), 600);
    later(() => face('half', 'w'), 900);
    later(() => face('closed', 'w'), 1300);
    later(() => { catEl.classList.remove('rub'); catEl.classList.add('stretch'); face('closed', 'yawn'); say('หาววววว~', 1300); }, 1800);
    later(() => { catEl.classList.remove('stretch', 'groggy'); face('open', 'o'); }, 3100);
    later(() => { face('happy', 'smile'); say(pick(['ตื่นแล้ว! มาเล่นกัน~', 'สดชื่นแล้ว เหมียว!']), 1500); floaty(['✦'], 3, GOLDS); }, 3500);
    later(() => { setMode('awake'); cat.lastPoke = performance.now(); }, 4600);
  }

  // ---------- input ----------
  let clicks = [];
  function pokeCat() {
    const now = performance.now();
    if (cat.mode === 'groggy') { say(pick(['อีกแป๊บน้า…', 'งือ…']), 1000); return; }
    if (cat.mode === 'eating') { say(pick(['กำลังกินอยู่น้า~', 'งั่มๆ อย่าเพิ่งกวน~']), 1000); return; }
    const wasSleepy = cat.mode === 'sleep' || cat.mode === 'sleepy';
    cat.lastPoke = now;
    if (wasSleepy) { clicks = []; wakeUpGroggy(); return; }

    clicks = clicks.filter(t => now - t < 2500);
    clicks.push(now);
    if (clicks.length >= 6) { clicks = []; superExcited(); return; }

    let name;
    do { name = pick(ACTION_NAMES); } while (name === lastAction);
    if (cat.mode === 'bored' && Math.random() < .6) name = pick(['excited', 'jump', 'wave']);
    doAction(name);
  }

  // ---------- dragging ----------
  const drag = { id: null, sx: 0, sy: 0, ox: 0, oy: 0, active: false, lastX: 0, lastT: 0, tilt: 0, vx: 0, startY: 0 };
  let suppressClick = false;

  catEl.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    if (cat.mode === 'falling' || cat.mode === 'eating') return;
    drag.id = e.pointerId; drag.active = false;
    drag.sx = e.clientX; drag.sy = e.clientY;
    drag.ox = cat.x - e.clientX; drag.oy = cat.y - e.clientY;
    drag.lastX = e.clientX; drag.lastT = performance.now(); drag.vx = 0;
    catEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  catEl.addEventListener('pointermove', e => {
    if (e.pointerId !== drag.id) return;
    if (!drag.active && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) startDrag();
    if (!drag.active) return;
    const now = performance.now();
    const dt = Math.max(1, now - drag.lastT);
    drag.vx = drag.vx * 0.6 + ((e.clientX - drag.lastX) / dt) * 0.4;
    drag.lastX = e.clientX; drag.lastT = now;
    const half = size * 0.4;
    cat.x = Math.min(Math.max(e.clientX + drag.ox, half), W - half);
    cat.y = Math.min(Math.max(e.clientY + drag.oy, size * 0.85), floorBottom);
    if (Math.abs(drag.vx) > 0.05) cat.face = drag.vx > 0 ? 1 : -1;
  });
  const endPointer = e => {
    if (e.pointerId !== drag.id) return;
    drag.id = null;
    if (drag.active) { drag.active = false; suppressClick = true; setTimeout(() => (suppressClick = false), 0); drop(); }
  };
  catEl.addEventListener('pointerup', endPointer);
  catEl.addEventListener('pointercancel', endPointer);

  function startDrag() {
    const wasAsleep = cat.mode === 'sleep' || cat.mode === 'sleepy';
    clearTimers(); stopWalking(); hush();
    drag.active = true;
    drag.startY = cat.y;
    cat.mode = 'drag';
    cat.lastPoke = performance.now();
    setClasses(['dragged']);
    if (wasAsleep) { face('wide', 'o'); mood('😳 ตื่นแล้ว!?'); say(pick(['เอ๊ะ!? ลอยได้!?', 'ฮะ! ใครอุ้มเค้า!']), 1600); }
    else {
      const r = Math.random();
      if (r < 0.5) { face('star', 'grin'); say(pick(['ว้าย~ ลอยได้!', 'บินได้แล้ว~!', 'วี้~!']), 1500); }
      else { face('wide', 'o'); say(pick(['เอ๋!? ปล่อยน้า~', 'ว้ายยย!', 'หวาาา~']), 1500); }
      mood('🙀 ลอยอยู่!');
    }
  }

  function drop() {
    cat.lastPoke = performance.now();
    catEl.style.setProperty('--tilt', '0deg');
    drag.tilt = 0;
    const landY = Math.max(cat.y, floorTop + 20 + Math.random() * (floorBottom - floorTop - 20) * 0.5);
    cat.fall = { vy: 0, landY, fromY: cat.y };
    cat.mode = 'falling';
    setClasses(['falling']);
    face('wide', 'o');
  }

  function land() {
    const height = cat.fall.landY - cat.fall.fromY;
    cat.y = cat.fall.landY;
    cat.fall = null;
    cat.mode = 'action';
    setClasses(['land']);
    dust(5);
    if (height > H * 0.35) {
      face('dizzy', 'o'); say(pick(['โอ๊ย~ มึนเลย @_@', 'ตุ้บ! หัวหมุน~']), 1500);
      later(() => setClasses(['dizzy']), 550);
      later(() => { setMode('awake'); cat.lastPoke = performance.now(); }, 2000);
    } else {
      face('happy', 'grin'); say(pick(['ลงจอดสวย~ ✨', 'ตุ้บ! เล่นอีก!', 'สนุกจัง! อีกๆ']), 1500);
      burst(STARS, 6, GOLDS);
      later(() => { setMode('awake'); cat.lastPoke = performance.now(); }, 1300);
    }
  }

  catEl.addEventListener('click', e => { e.stopPropagation(); if (suppressClick || cat.mode === 'drag' || cat.mode === 'falling') return; pokeCat(); });
  catEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pokeCat(); } });

  stage.addEventListener('click', e => {
    const now = performance.now();
    if (cat.mode === 'sleep') {
      restart('stir'); say(pick(['งืม…', 'อือ…', '…ฟี้']), 1200);
      setTimeout(() => catEl.classList.remove('stir'), 900);
      return;
    }
    if (cat.mode === 'groggy' || cat.mode === 'action' || cat.mode === 'drag' || cat.mode === 'falling' || cat.mode === 'eating') return;
    if (cat.mode === 'sleepy') { cat.lastPoke = now; wakeUpGroggy(); return; }
    cat.lastPoke = now;
    if (cat.mode === 'bored') setMode('awake');
    face('happy', 'smile');
    say(pick(['ไปแล้วๆ~', 'มาแล้วจ้า!', 'เหมียว? ไปจ้า~']), 1300);
    const y = Math.min(Math.max(e.clientY, floorTop + 20), floorBottom);
    walkTo(e.clientX, y, 170, () => { face('open', 'smile'); mini('tailflick', 1500); });
    catEl.classList.add('run');
    cat.nextIdle = now + 3000;
  });

  const pointer = { x: -1, y: -1 };
  window.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });

  // ---------- main loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    const idleFor = now - cat.lastPoke;
    if (cat.mode === 'awake' && idleFor > T_BORED) setMode('bored');
    else if (cat.mode === 'bored' && idleFor > T_SLEEPY) setMode('sleepy');
    else if (cat.mode === 'sleepy' && idleFor > T_SLEEP) setMode('sleep');

    if (cat.mode === 'drag') {
      const want = Math.max(-28, Math.min(28, -drag.vx * 22)) * cat.face;
      drag.tilt += (want - drag.tilt) * Math.min(1, dt * 10);
      drag.vx *= Math.pow(0.02, dt);
      catEl.style.setProperty('--tilt', drag.tilt.toFixed(1) + 'deg');
    } else if (cat.mode === 'falling' && cat.fall) {
      cat.fall.vy += 2600 * dt;
      cat.y += cat.fall.vy * dt;
      if (cat.y >= cat.fall.landY) land();
    }

    if (cat.target) {
      const dx = cat.target.x - cat.x, dy = cat.target.y - cat.y;
      const dist = Math.hypot(dx, dy);
      const stepLen = cat.speed * dt;
      if (Math.abs(dx) > 2) cat.face = dx > 0 ? 1 : -1;
      if (dist <= stepLen) {
        cat.x = cat.target.x; cat.y = cat.target.y;
        const cb = cat.onArrive;
        cat.target = null; cat.onArrive = null;
        catEl.classList.remove('walk', 'run');
        if (cb) cb();
      } else {
        cat.x += dx / dist * stepLen;
        cat.y += dy / dist * stepLen;
        catEl.classList.add('walk');
        if (cat.speed > 150 && !catEl.classList.contains('slow')) catEl.classList.add('run');
      }
    }

    if (cat.mode === 'awake' || cat.mode === 'bored' || cat.mode === 'sleepy' || cat.mode === 'sleep') idleTick(now);

    const s = scale();
    catEl.style.transform = `translate(${cat.x - size / 2}px, ${cat.y - size}px) scale(${s})`;
    catEl.style.setProperty('--face', cat.face);
    catEl.style.zIndex = 2;

    // eyes follow the pointer
    if (pointer.x >= 0 && catEl.dataset.eyes === 'open') {
      const h = headPos();
      let vx = (pointer.x - h.x) * cat.face, vy = pointer.y - h.y;
      const len = Math.hypot(vx, vy) || 1;
      const k = Math.min(1, len / 200) * 3.2;
      pupils.setAttribute('transform', `translate(${(vx / len * k).toFixed(2)} ${(vy / len * k).toFixed(2)})`);
    } else {
      pupils.removeAttribute('transform');
    }

    requestAnimationFrame(frame);
  }

  // ---------- feeding ----------
  const FOODS = [
    { key: 'fish', icon: '🐟', name: 'ปลา', value: 35 },
    { key: 'meat', icon: '🍖', name: 'เนื้อ', value: 40 },
    { key: 'bone', icon: '🦴', name: 'ขนม', value: 20 },
    { key: 'milk', icon: '🥛', name: 'นม', value: 25 },
  ];
  let fullness = 60;            // 0..100, slowly goes down
  const hungry = () => fullness < 30;
  let bowl = null;

  function showBelly() {
    bellyFill.style.width = Math.round(fullness) + '%';
    bellyEl.classList.toggle('hungry', hungry());
    bellyEl.title = 'ความอิ่ม ' + Math.round(fullness) + '%';
  }
  setInterval(() => {
    const wasHungry = hungry();
    fullness = Math.max(0, fullness - (cat.mode === 'sleep' ? 0.5 : 1));
    showBelly();
    if (!wasHungry && hungry() && cat.mode === 'awake') mood('🥺 หิวจัง');
  }, 3000);

  function removeBowl() {
    if (!bowl) return;
    const el = bowl.el;
    bowl = null;
    el.classList.add('gone');
    setTimeout(() => el.remove(), 500);
  }

  function feed(food) {
    if (cat.mode === 'drag' || cat.mode === 'falling' || cat.mode === 'eating' || bowl) return;
    const wasAsleep = cat.mode === 'sleep' || cat.mode === 'sleepy';
    clearTimers(); stopWalking();
    cat.lastPoke = performance.now();

    if (fullness >= 95) {
      cat.mode = 'action';
      setClasses(['nope']); face('closed', 'w');
      say(pick(['อิ่มแล้ว กินไม่ไหวแล้ว~', 'พุงจะแตกแล้วน้า~', 'ไว้ทีหลังนะ อิ่มมาก']), 1800);
      later(() => setMode('awake'), 1400);
      return;
    }

    // put a bowl somewhere on the floor, not right on top of the pet
    let bx = rand(size * 0.7, W - size * 0.7);
    if (Math.abs(bx - cat.x) < size * 0.6) bx = cat.x < W / 2 ? Math.min(W - size * 0.7, cat.x + size) : Math.max(size * 0.7, cat.x - size);
    const by = Math.min(floorBottom - 4, Math.max(floorTop + 40, cat.y + rand(-30, 30)));
    const el = document.createElement('div');
    el.className = 'bowl';
    el.style.setProperty('--pos', `translate(${bx - 38}px, ${by - 56}px)`);
    el.style.transform = `translate(${bx - 38}px, ${by - 56}px)`;
    el.innerHTML = `<div class="food">${food.icon}</div><svg viewBox="0 0 76 34"><ellipse cx="38" cy="8" rx="34" ry="7" fill="#ffb3c8" stroke="#6b3a4a" stroke-width="2.5"/><path d="M4 8 Q8 32 38 32 Q68 32 72 8" fill="#ff7aa2" stroke="#6b3a4a" stroke-width="2.5"/><path d="M14 20 Q38 26 62 20" fill="none" stroke="#fff" stroke-width="2.5" opacity=".7"/></svg>`;
    stage.appendChild(el);
    bowl = { el, x: bx, y: by, food };

    cat.mode = 'eating';
    setClasses([]);
    const fav = (pet.fav || ['meat', 'bone']).includes(food.key);
    if (wasAsleep) { face('wide', 'o'); say('ฟุดฟิด… กลิ่นอะไรหอมๆ!', 1300); }
    else { face('star', 'grin'); say(fav ? pick([`${food.name}!! ของโปรดเลย!`, `ว้าว ${food.name}! 😋`]) : pick(['ข้าวมาแล้ว!', 'หม่ำๆ!', 'น่ากินจัง~']), 1300); }
    mood('😋 หิวแล้ว!');
    later(() => {
      if (!bowl) return;
      face('happy', 'grin');
      const side = bowl.x >= cat.x ? -1 : 1;
      walkTo(bowl.x + side * size * 0.5, bowl.y - 10, 230, () => eat(fav));
      catEl.classList.add('run');
    }, wasAsleep ? 900 : 350);
  }

  function eat(fav) {
    if (!bowl) return;
    cat.face = bowl.x >= cat.x ? 1 : -1;
    setClasses(['eat']);
    face('closed', 'o');
    mood('😋 งั่มๆ');
    const foodEl = bowl.el.querySelector('.food');
    const bites = 4;
    for (let i = 0; i < bites; i++) {
      later(() => {
        if (!bowl) return;
        face(i % 2 ? 'closed' : 'happy', i % 2 ? 'o' : 'w');
        say(pick(['งั่มๆ', 'หม่ำๆ', 'อร่อยย~', 'จั๊บๆ']), 600);
        foodEl.style.transform = `translateX(-50%) scale(${1 - (i + 1) / bites * 0.85})`;
        for (let k = 0; k < 3; k++) fx('•', { at: { x: bowl.x, y: bowl.y - 30, s: 1 }, dx: rand(-40, 40), dy: rand(-40, -10), size: rand(10, 16), color: '#c98a45', dur: .7 });
      }, 300 + i * 650);
    }
    later(() => {
      if (!bowl) return;
      foodEl.style.opacity = '0';
      fullness = Math.min(100, fullness + bowl.food.value + (fav ? 10 : 0));
      showBelly();
      setClasses(['full']);
      face(fav ? 'heart' : 'happy', 'smile');
      say(fav ? pick(['ของโปรด! อร่อยที่สุดเลย ♥', 'อิ่มแปล้ ขอบคุณน้า ♥']) : pick(['อิ่มแล้ว~ อร่อยจัง!', 'เอิ้ก~ อิ่มจัง', 'ขอบคุณที่เลี้ยงข้าวน้า~']), 2000);
      floaty(HEARTS, fav ? 7 : 4, PINKS);
      mood('😊 อิ่มแปล้');
    }, 300 + bites * 650);
    later(() => removeBowl(), 300 + bites * 650 + 1200);
    later(() => { setMode('awake'); cat.lastPoke = performance.now(); }, 300 + bites * 650 + 2200);
  }

  FOODS.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'food-btn'; b.textContent = f.icon;
    b.title = 'ให้' + f.name; b.setAttribute('aria-label', 'ให้' + f.name);
    b.addEventListener('click', e => { e.stopPropagation(); feed(f); });
    foodsEl.appendChild(b);
  });
  foodsEl.addEventListener('click', e => e.stopPropagation());
  foodsEl.addEventListener('pointerdown', e => e.stopPropagation());
  showBelly();

  // ---------- choosing a pet ----------
  function mountPet(p) {
    pet = p;
    PetArt.paint(catEl, p);
    flipEl.innerHTML = PetArt.svg(p);
    pupils = flipEl.querySelector('.pupils');
    catEl.setAttribute('aria-label', p.label + ' แตะเพื่อเล่นด้วย');
    pickerEl.querySelectorAll('.pet-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.key === p.key)));
    try { localStorage.setItem('pet', p.key); } catch (e) {}
  }
  function switchPet(p) {
    if (p === pet || cat.mode === 'drag' || cat.mode === 'falling') return;
    clearTimers(); stopWalking(); hush(); removeBowl();
    cat.mode = 'action';
    setClasses(['poof']);
    burst(['✦', '✧', '☁'], 10, GOLDS.concat(['#ffffff']));
    later(() => { mountPet(p); layout(); }, 240);
    later(() => { cat.lastPoke = performance.now(); doAction('wave'); say(pick([`สวัสดี! เราคือ${p.name}~`, `${p.name}มาแล้วจ้า!`, `หวัดดี~ ${p.sound}!`]), 2000); }, 520);
  }
  PetArt.PETS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pet-btn'; b.dataset.key = p.key;
    b.setAttribute('aria-label', p.label);
    const t = document.createElement('div');
    t.className = 'thumb'; t.dataset.eyes = 'happy'; t.dataset.mouth = 'smile';
    PetArt.paint(t, p);
    t.innerHTML = PetArt.svg(p);
    const n = document.createElement('span'); n.textContent = p.name;
    b.append(t, n);
    b.addEventListener('click', e => { e.stopPropagation(); switchPet(p); });
    pickerEl.appendChild(b);
  });
  pickerEl.addEventListener('click', e => e.stopPropagation());
  pickerEl.addEventListener('pointerdown', e => e.stopPropagation());
  let saved = null;
  try { saved = localStorage.getItem('pet'); } catch (e) {}
  mountPet(PetArt.PETS.find(p => p.key === saved) || PetArt.PETS[0]);

  window.addEventListener('resize', layout);
  layout();
  cat.x = W / 2; cat.y = floorTop + (floorBottom - floorTop) * 0.55;
  layout();
  setMode('awake');
  setTimeout(() => { doAction('wave'); cat.lastPoke = performance.now(); }, 600);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
